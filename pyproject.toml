[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "maicon-sim"
version = "0.1.0"
description = "Deterministic MAICON 2D/3D simulation with shared rules and isolated participant ports"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=2.0,<2.3",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
viewer = ["pygame-ce>=2.5,<3"]
bullet = ["pybullet==3.2.7"]
vision = ["opencv-python-headless>=4.11,<5"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "build>=1.2,<2"]

[project.scripts]
maicon-sim = "maicon_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maicon_sim"]

[tool.hatch.build.targets.wheel.force-include]
"uv.lock" = "maicon_sim/resources/uv.lock"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: pure unit checks", "contract: public wire and port contracts",
  "integration: connected engine and services", "render: PyBullet DIRECT rendering",
  "e2e: subprocess and installation workflows", "slow: real wall-clock tests",
  "performance: reproducible measurements", "manual_gui: interactive display checks",
  "hardware: checks requiring actual competition equipment",
]
